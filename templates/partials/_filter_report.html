{# Filter global report (BISNIS_PROSES_PDLN.MD §10). Context dari views_report._konteks_filter. Dipakai Rekap data & Export Database. #}
<form method="get" class="box filter-report">
  {% if tab %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}

  <div class="filter-report-title">Filter</div>
  <div class="filter-report-grid">
    <div class="field"><label class="label" for="f-jenis">Jenis</label>
      <div class="select"><select id="f-jenis" name="jenis">
        <option value="">Semua</option>
        {% for v, l in opsi_jenis %}<option value="{{ v }}" {% if f.jenis == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select></div></div>
    <div class="field"><label class="label" for="f-tipe">Tipe PDLN</label>
      <div class="select"><select id="f-tipe" name="tipe">
        <option value="">Semua</option>
        {% for v, l in opsi_tipe %}<option value="{{ v }}" {% if v in f.tipe %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select></div></div>
    <div class="field"><label class="label" for="f-status">Status</label>
      <div class="select"><select id="f-status" name="status">
        <option value="">Semua</option>
        {% for v, l in opsi_status %}<option value="{{ v }}" {% if v in f.status %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select></div></div>
    {% if opsi_unor %}
    <div class="field"><label class="label" for="f-unor">Unit Organisasi</label>
      <div class="select"><select id="f-unor" name="unor">
        <option value="">Semua</option>
        {% for u in opsi_unor %}<option value="{{ u.pk }}" {% if f.unor == u.pk|stringformat:"s" %}selected{% endif %}>{{ u.alias }}</option>{% endfor %}
      </select></div></div>
    {% endif %}
    <div class="field"><label class="label" for="f-negara">Negara</label>
      <div class="select"><select id="f-negara" name="negara">
        <option value="">Semua</option>
        {% for n in opsi_negara %}<option value="{{ n.pk }}" {% if f.negara == n.pk|stringformat:"s" %}selected{% endif %}>{{ n.nama_negara }}</option>{% endfor %}
      </select></div></div>
    {% if opsi_kegiatan %}
    <div class="field"><label class="label" for="f-kegiatan">Kegiatan</label>
      <div class="select"><select id="f-kegiatan" name="kegiatan">
        <option value="">Semua</option>
        {% for k in opsi_kegiatan %}<option value="{{ k.pk }}" {% if f.kegiatan == k.pk|stringformat:"s" %}selected{% endif %}>{{ k.nama|truncatechars:40 }} ({{ k.tahun_pelaksanaan }})</option>{% endfor %}
      </select></div></div>
    <div class="field"><label class="label" for="f-tahun">Tahun Kegiatan</label>
      <div class="select"><select id="f-tahun" name="tahun_kegiatan">
        <option value="">Semua</option>
        {% for t in opsi_tahun_kegiatan %}<option value="{{ t }}" {% if f.tahun_kegiatan == t|stringformat:"s" %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select></div></div>
    {% endif %}
    <div class="field"><label class="label" for="f-kanal">Kanal</label>
      <div class="select"><select id="f-kanal" name="kanal">
        <option value="">Semua</option>
        {% for v, l in opsi_kanal %}<option value="{{ v }}" {% if f.kanal == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select></div></div>
  </div>

  <div class="filter-report-periode">
    <div class="field"><label class="label" for="f-basis">Periode Berdasarkan</label>
      <div class="select"><select id="f-basis" name="basis_tanggal">
        <option value="tgl_pengajuan" {% if f.basis_tanggal == "tgl_pengajuan" %}selected{% endif %}>Tgl Pengajuan</option>
        <option value="tgl_berangkat" {% if f.basis_tanggal == "tgl_berangkat" %}selected{% endif %}>Tgl Berangkat</option>
      </select></div></div>
    <div class="field"><label class="label" for="f-dari">Dari</label>
      <input class="input" type="date" id="f-dari" name="dari" value="{{ f.dari|date:'Y-m-d' }}"></div>
    <div class="field"><label class="label" for="f-sampai">Sampai</label>
      <input class="input" type="date" id="f-sampai" name="sampai" value="{{ f.sampai|date:'Y-m-d' }}"></div>
    <div class="filter-report-actions">
      <a href="?{% if tab %}tab={{ tab }}{% endif %}" class="button">Reset</a>
      <button type="submit" class="button is-primary">Terapkan</button>
    </div>
  </div>
</form>
