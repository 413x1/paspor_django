{% if breadcrumbs %}
<nav class="app-breadcrumb" aria-label="Breadcrumb">
  <ol>
    {% for c in breadcrumbs %}
      <li>
        {% if c.url %}<a href="{{ c.url }}">{{ c.label }}</a>
        {% elif forloop.last %}<span aria-current="page">{{ c.label }}</span>
        {% else %}<span>{{ c.label }}</span>{% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
