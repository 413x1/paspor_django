{# Tombol kembali bergaya: chip bulat berisi panah + teks dua baris ("Kembali ke" / nama halaman). Context: url, label. #}
<a href="{{ url }}" class="tombol-kembali" title="Kembali ke {{ label }}" aria-label="Kembali ke {{ label }}">
  <span class="tombol-kembali-ikon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </span>
  <span class="tombol-kembali-teks"><small>Kembali ke</small><strong>{{ label }}</strong></span>
</a>
