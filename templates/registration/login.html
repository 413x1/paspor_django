{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PASPOR</title>
  <link rel="stylesheet" href="{% static 'vendors/bulma/css/versions/bulma-no-dark-mode.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20261125b">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="logo" src="{% static 'images/logopu.png' %}" alt="Logo Kementerian PU">
      <h2>PASPOR</h2>
      <div class="role-pill"><span class="tag">Kementerian Pekerjaan Umum</span></div>

      {% if error %}
        <div class="login-error">{{ error }}</div>
      {% endif %}
      {% for message in messages %}
        <div class="login-error">{{ message }}</div>
      {% endfor %}

      {% if sso_tersedia %}
        <a href="{% url 'sso_login' %}" class="button is-primary is-fullwidth">Masuk dengan SSO</a>
        <div class="login-divider"><span>atau</span></div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label class="label" for="username">Username</label>
          <div class="control">
            <input class="input" type="text" id="username" name="username" placeholder="username.pegawai" required autofocus>
          </div>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="control password-control">
            <input class="input" type="password" id="password" name="password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" data-toggle-password="#password" aria-controls="password"
              aria-pressed="false" aria-label="Tampilkan password" title="Tampilkan password">
              <svg class="ikon-tampil" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3.2"/></svg>
              <svg class="ikon-sembunyi" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3.2"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label class="checkbox">
            <input type="checkbox" name="remember_me"> Ingat saya
          </label>
        </div>
        <button type="submit" class="button {% if sso_tersedia %}is-light{% else %}is-primary{% endif %} is-fullwidth">Masuk dengan Username</button>
      </form>
      <p class="helptext">Akses menggunakan akun resmi Kementerian PU</p>
    </div>
  </div>

  <script src="{% static 'vendors/JQuery/jquery-4.0.0.min.js' %}"></script>
  <script>
    $(function () {
      // Tombol mata pada kolom password: lihat atau sembunyikan isian. Dipasang lewat atribut data-toggle-password.
      function atur($tombol, tampil) {
        var input = $($tombol.data('toggle-password')).get(0);
        if (!input) { return; }
        var awal = input.selectionStart, akhir = input.selectionEnd;
        input.type = tampil ? 'text' : 'password';
        var label = tampil ? 'Sembunyikan password' : 'Tampilkan password';
        $tombol.toggleClass('is-aktif', tampil).attr({ 'aria-pressed': String(tampil), 'aria-label': label, title: label });
        return { input: input, awal: awal, akhir: akhir };
      }
      function sembunyikanSemua() { $('[data-toggle-password]').each(function () { atur($(this), false); }); }

      $(document).on('click', '[data-toggle-password]', function (e) {
        var $tombol = $(this);
        var s = atur($tombol, !$tombol.hasClass('is-aktif'));
        // Klik mouse: fokus kembali ke kolom (kursor di tempatnya) agar bisa lanjut mengetik. Aktivasi keyboard
        // (Enter atau Spasi, detail = 0): fokus tetap di tombol supaya Spasi berikutnya tidak diketik ke password.
        if (s && e.originalEvent && e.originalEvent.detail > 0) {
          s.input.focus();
          try { s.input.setSelectionRange(s.awal, s.akhir); } catch (err) { /* tipe input tertentu tidak mendukung */ }
        }
      });
      // Saat dikirim, kolom kembali bertipe password supaya pengelola password browser mengenalinya.
      $('form').on('submit', sembunyikanSemua);
      // Halaman dipulihkan dari cache Back/Forward: jangan menampilkan password yang tersisa.
      window.addEventListener('pageshow', function (e) { if (e.persisted) { sembunyikanSemua(); } });
    });
  </script>
</body>
</html>
