{% if ringkasan %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;background-color:#f6f8fc;border:1px solid #e5eaf2;border-radius:8px;">
  <tr>
    <td style="padding:14px 16px;font-size:13px;line-height:1.7;color:#374151;">
      <strong style="color:#1d3557;">Kode Pengajuan:</strong> {{ ringkasan.kode }}<br>
      <strong style="color:#1d3557;">Pegawai:</strong> {{ ringkasan.pegawai }}<br>
      <strong style="color:#1d3557;">Perihal:</strong> {{ ringkasan.perihal }}<br>
      <strong style="color:#1d3557;">Status:</strong> {{ ringkasan.status }}
    </td>
  </tr>
</table>
{% endif %}
